server:
  url: server_test_url

security:
  jwt:
    internal:
      key: internalKeyinternalKeyinternalKeyinternalKey

eureka:
  client:
    enabled: false

spring:
  kafka:
    bootstrap-servers: test

kafka:
  events:
    product:
      created-event:
        topic: "PRODUCT_CREATED_TEST_TOPIC"
      updated-event:
        topic: "PRODUCT_UPDATED_TEST_TOPIC"
      image-requested-event:
        topic: "PRODUCT_IMAGE_REQUESTED_TEST_TOPIC"
        groupId: "product_image_requested_group"
        container-factory: "consumerContainerFactory"
        properties:
          auto-offset-reset: "latest"
        auto-startup: "false"

endpoints:
  unauthenticated:
    general:
      - /actuator/health
    internal:
      - /internal/**
    product:
      - /categories/tree
      - /products/compare
