security:
  jwt:
    internal:
      key: internalKeyinternalKeyinternalKeyinternalKey

eureka:
  client:
    enabled: false

spring:
  kafka:
    bootstrap-servers: test

kafka:
  events:
    product:
      created-event:
        topic: "PRODUCT_CREATED_TEST_TOPIC"
      updated-event:
        topic: "PRODUCT_UPDATED_TEST_TOPIC"

endpoints:
  unauthenticated:
    general:
      - /actuator/health
    internal:
      - /internal/**
    product:
      - /categories/tree

product:
  image:
    max-size: 1000